  --hover:#344760;--accent:#80b5ff;--accent-hover:#a3caff;--primary-text:#14243c;
  --status-bg:#263d58;--status-text:#bdd9ff;--error-bg:#502f36;--error-text:#ffc1c6;

*{box-sizing:border-box}
body{margin:0;padding:10px 12px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
header strong{font-size:16px}
#count,.muted{color:var(--muted);font-size:11px}
.row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.row>select{min-width:0;flex:1}
button,select,input{font:inherit;border:1px solid var(--border);border-radius:5px;min-height:28px;background:var(--surface);color:inherit}
button{padding:4px 8px;white-space:nowrap;cursor:pointer}
button:hover:enabled{border-color:var(--accent);background:var(--hover)}
button:disabled,input:disabled,select:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input{padding:3px 6px;min-width:0;width:100%}
select{padding:3px}
#scope{flex:1.2}#layer{flex:.8}
.target #targetMode{flex:1.7}.target input{width:90px}.target #unit{flex:.65}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.grid label{color:var(--muted);font-size:11px}
.grid input{margin-top:4px;color:var(--text);font-size:12px}
.table-wrap{max-height:90px;min-height:66px;overflow:auto;border:1px solid var(--table-border);border-radius:5px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--table-head);color:var(--muted)}
th,td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--row-border)}
th:first-child,td:first-child{text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.empty{text-align:center;color:var(--muted);height:45px}
svg{display:block;width:100%;height:64px;background:var(--preview-bg);border-radius:5px;margin:8px 0}
svg text{fill:var(--preview-text);font-size:10px}
svg line,svg path{vector-effect:non-scaling-stroke;stroke-width:1.6;stroke-linecap:round}
.actions{display:flex;gap:8px}.actions button{flex:1;min-height:32px}
.primary{background:var(--accent);color:var(--primary-text);border-color:var(--accent)}
.primary:hover:enabled{background:var(--accent-hover);color:var(--primary-text)}
#hint{font-size:10px;line-height:1.6;color:var(--muted);margin:7px 0}
#status{min-height:36px;font-size:11px;line-height:1.5;padding:7px 8px;border-radius:5px;background:var(--status-bg);color:var(--status-text);overflow-wrap:anywhere}
#status.error{background:var(--error-bg);color:var(--error-text)}
.differential-row{font-size:11px;margin-bottom:6px}
.differential-row label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.differential-row input{width:14px;min-height:14px;margin:0}
.differential-row span{color:var(--muted);font-size:10px}
</style></head>
<body>
<header><strong>一键等长</strong><div style="display:flex;align-items:center;gap:8px"><span id="count">未读取</span><button id="clear" title="清空累计目标和画布选中集">清空</button></div></header>
<div class="row"><select id="scope" aria-label="等长范围"><option value="route">完整走线</option><option value="segment">选中线段</option></select><select id="layer" aria-label="铜层"><option value="auto" selected>自动识别</option><option value="1">顶层</option><option value="2">底层</option></select><button id="pick">两点取区</button><button id="read">读取选中</button></div>

<div class="grid">
<label title="相邻折返臂的中心线间距；圆角蛇形保持此设定值">间距 W<input id="pitch" type="number" min="0" step="any" value="20"></label>
<label title="原走线中心线到峰顶的最小距离；双边峰谷总高度至少为 2H">最小振幅 H<input id="minAmplitude" type="number" min="0" step="any" value="10"></label>
<label>最大振幅<input id="amplitude" type="number" min="0" step="any" value="100"></label>
<label>避让净距<input id="clearance" type="number" min="0" step="any" value="6"></label>
<label>长度容差<input id="tolerance" type="number" min="0" step="any" value="0.1"></label>
<label>波数<input id="lobes" aria-label="波数" title="连续蛇形的波数，0为自动；大折返不使用此参数" type="number" min="0" max="48" step="1" value="4"></label>
</div>
<div class="row"><label for="pattern">等长方式</label><select id="pattern"><option value="single" selected>单边蛇形</option><option value="double">双边蛇形</option><option value="large">大折返</option><option value="mixed">混合模式（自动组合）</option></select><label style="display:flex;align-items:center;gap:3px;white-space:nowrap" title="每个折返独立分配振幅；严格遵守最小/最大振幅"><input id="dynamicAmplitude" aria-label="动态振幅" type="checkbox" checked style="width:14px;min-height:14px">动态振幅</label></div>
<div class="row"><label for="side">方向</label><select id="side" aria-label="补长方向"><option value="auto">自动寻找两侧</option><option value="left">起点→终点左侧</option><option value="right">起点→终点右侧</option></select><select id="mode" aria-label="避让模式"><option value="push" selected>自动推挤</option><option value="direct">仅空位补长</option></select></div>
<div class="row differential-row"><label title="选择两个网络，需有同层平行区段；支持沿过孔跨层的完整路径"><input id="differential" aria-label="差分模式" type="checkbox">差分模式</label><span>两条线为一对 · 优先蛇形、共同折返</span></div>
<div class="table-wrap"><table><thead><tr><th>目标网络</th><th>原长</th><th>补长后</th><th>增量</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">读取后显示各目标长度</td></tr></tbody></table></div>

<div class="actions"><button id="previewButton" disabled>预览等长方案</button><button id="apply" class="primary" disabled>应用等长</button></div>
<p id="hint">完整走线沿过孔跨层计长；读取可累积，清空后重新开始。</p>
<div id="status" role="status" aria-live="polite">正在连接控制器…</div>

      lastRevision = state.revision;
      pending = "";
      busy = !!state.busy;
      picking = !!state.picking;
      valid = !!state.valid;
      ready = !!state.previewReady && !dirty;
      byId("count").textContent = `${Number(state.count) || 0} 个目标 · ${select("unit").value}`;
      status(state.message || "请选择走线", !!state.error);
      const nextGroups = { equalLength: state.equalLengthGroups ?? [], netClass: state.netClasses ?? [] };
      if (JSON.stringify(nextGroups) !== JSON.stringify(savedGroups)) {
        savedGroups = nextGroups;
        renderGroups();
      }
      if (Array.isArray(state.layers) && JSON.stringify(state.layers) !== layerList) {
        layerList = JSON.stringify(state.layers);
        const old = select("layer").value;
        select("layer").replaceChildren(new Option("自动识别", "auto"), ...state.layers.map((l) => new Option(l.name, String(l.id))));
        if (old === "auto" || state.layers.some((l) => String(l.id) === old)) select("layer").value = old;
      }
      const detected = state.valid ? state.layers?.filter((l) => (state.resolvedLayers ?? [state.resolvedLayer]).includes(l.id)) : [];
      select("layer").options[0].text = detected?.length > 1 ? `自动 · ${detected.length}层` : detected?.length ? `自动 · ${detected[0].name}` : "自动识别";
      select("layer").title = detected?.length && select("layer").value === "auto" ? `自动识别铜层：${detected.map((l) => l.name).join(" / ")}` : "按走线自动识别，可同时处理不同铜层；完整路径沿过孔连接";
      rawRows = state.rows || [];
      renderRows();
      renderPreview(state.preview || [], state.pushedPreview || []);
      controls();
    } catch (error) {
      console.error("[TrackEqualLength]", "Poll failed", error);
      status(`控制器读取失败：${String(error)}`, true);
    } finally {
      polling = false;
    }
  }
  byId("read").onclick = () => void send("read");
  byId("refreshGroups").onclick = () => void send("refreshGroups");
  byId("readGroup").onclick = () => void send("readGroup");
  select("targetGroup").onchange = () => {
    groupChoice[select("groupKind").value] = select("targetGroup").value;
    renderGroups();
    controls();
  };
  select("groupKind").onchange = () => {
    renderGroups();
    controls();
  };
  byId("clear").onclick = () => {
    valid = false;
    ready = false;
    void send("clear");
  };
  byId("pick").onclick = () => void send(picking ? "cancel" : "pick");
  byId("previewButton").onclick = () => void send("preview");
  byId("apply").onclick = () => void send("apply");
  for (const id of ["scope", "layer"]) byId(id).onchange = () => {
    valid = false;
    ready = false;
    controls();
    void send("selection");
  };
  function markDirty() {
    dirty = true;
    ready = false;
    controls();
    status("参数已改变，请重新预览");
  }
  for (const id of [...fields, "lobes"]) byId(id).oninput = markDirty;
  for (const id of ["targetMode", "side", "mode", "pattern", "dynamicAmplitude", "differential"]) byId(id).onchange = markDirty;
  select("unit").onchange = () => {
    for (const id of fields) if (Number.isFinite(input(id).valueAsNumber)) input(id).value = String(Number((input(id).valueAsNumber * previousFactor / factor()).toFixed(8)));
    previousFactor = factor();
    renderRows();
    byId("count").textContent = `${rawRows.length} 个目标 · ${select("unit").value}`;
    markDirty();
  };
  controls();
  void poll();
  setInterval(() => {
    void poll();
  }, 200);
})();
</script></body></html>
